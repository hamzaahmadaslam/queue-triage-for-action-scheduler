name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards and PHP 7.4 compatibility
        run: vendor/bin/phpcs

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Syntax
        run: for f in queue-triage-for-action-scheduler.php uninstall.php includes/*.php tests/fixtures/*.php tests/unit/*.php; do php -l "$f"; done
      - run: composer install --no-interaction --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported
            php: "7.4"
            wp: "6.5.5"
            scheduler: "action-scheduler --version=3.9.2"
          - name: current
            php: "8.4"
            wp: "7.1.3"
            scheduler: "woocommerce"
    name: integration (${{ matrix.name }})
    services:
      db:
        image: mariadb:11.8
        env:
          # A throwaway container that lives for this job only.
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - name: WP-CLI, WordPress ${{ matrix.wp }} and ${{ matrix.scheduler }}
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -sSfL -o "$HOME/bin/wp" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          wp core download --version=${{ matrix.wp }} --path="$RUNNER_TEMP/wp"
          wp config create --path="$RUNNER_TEMP/wp" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path="$RUNNER_TEMP/wp" --url=http://localhost --title=Scratch --admin_user=scratch --admin_email=scratch@example.com --skip-email
          wp plugin install ${{ matrix.scheduler }} --activate --path="$RUNNER_TEMP/wp"
      - name: Integration tests
        run: WP_PATH="$RUNNER_TEMP/wp" bash tests/integration.sh

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the plugin as shipped
        run: bash bin/build.sh
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/queue-triage-for-action-scheduler
